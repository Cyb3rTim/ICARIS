name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Migrations match models
        env: { DJANGO_DEBUG: "true" }
        run: python manage.py makemigrations --check --dry-run

      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: Deployment checklist
        env:
          DJANGO_SECRET_KEY: ci-check-only-${{ github.run_id }}-not-a-real-secret-value
          DJANGO_ALLOWED_HOSTS: icaris.example.com
        run: python manage.py check --deploy --fail-level ERROR

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Static analysis (bandit)
        run: bandit -c pyproject.toml -r grc_dashboard grc_project ato
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt
