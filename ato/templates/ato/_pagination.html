{% if page.paginator.num_pages > 1 %}
<div class="pagination-bar">
    <span>Page {{ page.number }} of {{ page.paginator.num_pages }} &middot; {{ page.paginator.count }} total</span>
    <span class="inline-actions">
        {% if page.has_previous %}<a class="btn-secondary-custom" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.previous_page_number }}">&larr; Previous</a>{% endif %}
        {% if page.has_next %}<a class="btn-secondary-custom" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.next_page_number }}">Next &rarr;</a>{% endif %}
    </span>
</div>
{% endif %}
