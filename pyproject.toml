[project]
name = "icaris"
version = "1.1.0"
description = "ICARIS: GRC automation for ATO tracking, continuous monitoring and vulnerability remediation"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "grc_project.settings_test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["grc_dashboard", "grc_project", "ato"]
omit = ["*/migrations/*", "*/tests/*", "grc_project/asgi.py", "grc_project/wsgi.py"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ"]
ignore = [
    "S101",   # assert in tests
    "E501",   # long template-ish strings in views are acceptable
    "DJ012",  # model member ordering; reordering legacy models adds churn without benefit
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S105", "S106"]  # test passwords
"create_sample_data.py" = ["E402", "S105", "S106", "S311"]  # django.setup() must run before model imports

[tool.bandit]
exclude_dirs = ["grc_dashboard/tests", "grc_dashboard/migrations", "ato/tests", "ato/migrations"]
